# Earth Engine Beamer-Minor Method zonal stats

[INPUTS]
# GCloud Project ID
gcloud_project_id = ee-bminor

# Path to phreatophyte shapefile and the zone/field name
zone_shp_path = C:\Users\bminor\Documents\Nevada_Water_Initiative\Groundwater_discharge\2025_progress\flowsystems\Humboldt_River\HA053_Pine_Valley\NV_phreats_MASTER_v11_PineValley_053_w_ag.shp
zone_field = FID

# Path to phreatophyte shapefile that is used to clip the images
img_zone_path = C:\Users\bminor\Documents\Nevada_Water_Initiative\Groundwater_discharge\2025_progress\flowsystems\Humboldt_River\HA053_Pine_Valley\NV_phreats_MASTER_v11_PineValley_053_w_ag.shp

# local output folder for export stats (newer addition that avoids google drive or cloud storage)
local_output_path = C:\Users\bminor\Documents\Nevada_Water_Initiative\Groundwater_discharge\2025_progress\flowsystems\Humboldt_River\HA053_Pine_Valley

# Hydrographic Area to use (State Engineer's HA boundary HYD_AREA attribute with leading zeros)
hyd_area = 053

# Start and end water years
# DOY filtering to build composite NDVI images
start_year = 1984
end_year = 2025
start_doy = 152
end_doy = 259

# Specify Landsat path/rows containing phreatophyte boundary
path_keep_list = 41
row_keep_list = 32

# flag to buffer intersecting gridMET cells inward to (typically for larger basins/phreatophyte boundaries)
grid_buffer_flag = True

# gridMET cells to exclude (e.g., if higher elevation grid cells need to be exluded)
# see Earth Engine Javascript code here to help decide, but you will need the geometry/coordinates of you phreatophyte shapefile
# (https://code.earthengine.google.com/16eec97ea0ab2167cb40b6e8afb0890f)
grid_skip_list = 490850, 492235, 503327


[ZONAL_STATS]
# Google Drive folder for export stats
output_folder = BeamerMinor2025

# flag to use long-term median ETg image that has replacement/scaled ETg rates burned in from the shapefile
replacement_rate_etg_flag = True


[IMAGES]
# Beamer-Minor Regression Version (Latest update March 2026 confidence/prediction interval fix)
#bmm_regress_vers = v2p1p3
bmm_regress_vers = v2p3p1

# specify whether to store BMM prep images as earth engine assets (250gb max) or as COGs in cloud storage
# ee_asset or cloud_storage
image_storage_location = cloud_storage

# earth engine asset path or cloud storage bucket path where the images are stored
#export_dest = nwi-groundwater-discharge/bmm_images
export_dest = projects/dri-nwi-425400/assets/bmm

# specify if images being processed for export or zonal stats are using etm2oli or oli2etm images; not used in image prep
harmonization_type = oli2etm

# set the list of bands to export (et_star, ndvi, eta, etg, eta_lci, eta_uci, etg_lci, etg_uci, etg_adj, etg_lci_adj, etg_uci_adj)
band_list = etg_adj

# Water Index asset ID for masking water pixels out of BMM images
#water_index_id = projects/dri-nwi-425400/assets/water_indices/NDWI_long_term_median_1984_2023_DOY_152_258
water_index_id = projects/dri-nwi-425400/assets/water_indices/MNDWI_long_term_median_1984_2023_DOY_152_258

# minimum ETg value in feet/year to use for pixels whose NDVI value is too low (default is 0.01 feet/year)
min_etg_threshold = 0.01